<!doctype html><meta charset="utf-8"><title>Town wall comparison</title><style>body{margin:0;background:#83969c;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}nav{position:absolute;top:10px;left:10px;z-index:5;background:#fffd;padding:8px}button,a{margin:5px}</style><nav><a href="?scenario=zatec_1421">Žatec</a><a href="?scenario=nemecky_brod_1422">Německý Brod</a><button id="overview">Overview</button><button id="town">Town close-up</button><button id="opposite">Opposite side</button><button id="units">Units</button><button id="wagon">Wagon crossing</button><label>Progress <input id="progress" type="range" min="0" max="100" value="0"></label><span id="status">Loading</span></nav><canvas></canvas><script type="module">
import './views/3d/integrated/hex-three.js?wall-pass=5';
const id=new URLSearchParams(location.search).get('scenario')||'zatec_1421',live=await(await fetch(`.wall-${id}.json`)).json();let units=false,wagon=false;
try{const battle=await window.HussiteBattle3D.create(document.querySelector('canvas'),{assetBase:'assets/3d/',artManifestBase:'assets/3d/scenarios/',snapshot:{...live,units:[]}});window.previewBattle=battle;battle.setUnitLabelsVisible?.(false);
const rig=battle.cameraRig,original={position:rig.camera.position.clone(),target:rig.controls.target.clone()},town=live.tiles.filter(c=>c.terrain==='town'),centres=town.map(c=>battle.terrain.layout.center(c.col,c.row)),focus={x:centres.reduce((s,p)=>s+p.x,0)/centres.length,z:centres.reduce((s,p)=>s+p.z,0)/centres.length};
const from=id==='zatec_1421'?{col:8,row:7}:{col:7,row:10},to=id==='zatec_1421'?{col:7,row:7}:{col:6,row:10};
const update=async()=>{const marker={id:999,type:'VOZOVA_HRADBA',name:'Clearance wagon',faction:'hussites',unitClass:'wagon',health:100,maxHealth:100,morale:85,maxMorale:85,hasMoved:false,hasAttacked:false,isDefending:false,isRouting:false,formationClosed:false,marching:true,...to};await battle.applySnapshot({...live,revision:Date.now(),units:wagon?[marker]:units?live.units:[],movement:wagon?{unitId:999,from,to,progress:Number(document.querySelector('#progress').value)/100}:undefined});};
document.querySelector('#overview').onclick=()=>{rig.camera.position.copy(original.position);rig.controls.target.copy(original.target);rig.controls.update()};
document.querySelector('#town').onclick=()=>{rig.controls.target.set(focus.x,0,focus.z);rig.camera.position.set(focus.x+28,40,focus.z+34);rig.controls.update()};
document.querySelector('#opposite').onclick=()=>{rig.controls.target.set(focus.x,0,focus.z);rig.camera.position.set(focus.x-32,22,focus.z-35);rig.controls.update()};
document.querySelector('#units').onclick=()=>{units=!units;wagon=false;update()};document.querySelector('#wagon').onclick=()=>{wagon=!wagon;update()};document.querySelector('#progress').oninput=update;document.querySelector('#status').textContent='Ready';
}catch(e){document.querySelector('#status').textContent=String(e);console.error(e)}
</script>
