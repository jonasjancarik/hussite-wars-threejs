name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Kontroly projektu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Načtení zdrojů
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntaxe, testy, styly, překlady a scénáře
        run: node scripts/check.js

  diorama:
    name: Three.js diorama
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/sudomer-diorama
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm --prefix web/hex-three ci
      - run: npm --prefix web/hex-three test
      - run: ./scripts/build_sudomer_hex_three.sh
      - run: node scripts/hex-diorama/test-reference.cjs
      - run: node scripts/hex-diorama/test-bridge.cjs
