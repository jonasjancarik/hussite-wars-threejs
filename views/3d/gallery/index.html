<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Model Gallery</title>
  <meta name="description" content="Every GLB under assets/3d/models, turnable in 3D and grouped by folder.">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #efe9dc;
      --panel: #f8f4ea;
      --card: #e6dfcf;
      --ink: #2b261e;
      --muted: #6f6656;
      --line: #cfc5b0;
      --accent: #8b3f35;
      --stage-top: #e9e3d4;
      --stage-bottom: #d4cab3;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1916;
        --panel: #24211c;
        --card: #2c2821;
        --ink: #ece5d6;
        --muted: #a39984;
        --line: #3d372d;
        --accent: #d9897b;
        --stage-top: #34302a;
        --stage-bottom: #24211c;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1b1916; --panel: #24211c; --card: #2c2821; --ink: #ece5d6; --muted: #a39984;
      --line: #3d372d; --accent: #d9897b; --stage-top: #34302a; --stage-bottom: #24211c; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 16px;
    }
    .bar { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
    h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .01em; }
    h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-left: auto; }
    input[type="search"] {
      background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; min-width: 180px; font: inherit;
    }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .seg button {
      background: var(--panel); color: var(--muted); border: 0; padding: 6px 10px; font: inherit; cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
    nav.toc { max-width: 1400px; margin: 8px auto 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
    nav.toc a { color: var(--muted); text-decoration: none; }
    nav.toc a:hover { color: var(--accent); }
    main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 64px; }
    section { margin-top: 26px; scroll-margin-top: 96px; }
    section h2 {
      font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em;
    }
    section h2 b { color: var(--ink); font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
      cursor: pointer; text-align: left; padding: 0; color: inherit; font: inherit; display: block; width: 100%;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
    .card .view {
      aspect-ratio: 1 / 1; width: 100%; position: relative;
      background: linear-gradient(var(--stage-top), var(--stage-bottom));
    }
    .card .view .status {
      position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px;
    }
    .card .meta { padding: 7px 10px 9px; border-top: 1px solid var(--line); }
    .card .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .facts { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    #cards-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }

    dialog {
      width: min(1200px, calc(100vw - 32px)); height: min(820px, calc(100vh - 32px)); max-width: none; max-height: none;
      padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink);
    }
    dialog::backdrop { background: rgb(0 0 0 / .55); }
    .detail { display: grid; grid-template-columns: 1fr 300px; height: 100%; }
    .detail .stage { position: relative; background: linear-gradient(var(--stage-top), var(--stage-bottom)); min-height: 0; }
    .detail .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .detail .hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
    .detail aside { border-left: 1px solid var(--line); padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
    .detail aside h3 { margin: 0; font-size: 18px; word-break: break-word; }
    .detail .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
    .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
    .detail dt { color: var(--muted); }
    .detail dd { margin: 0; font-variant-numeric: tabular-nums; }
    .detail .opts { display: flex; flex-direction: column; gap: 8px; }
    .detail .mats { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .detail .nav { display: flex; gap: 8px; margin-top: auto; }
    .btn {
      background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 12px; font: inherit; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .close { position: absolute; top: 10px; right: 10px; z-index: 1; }
    @media (max-width: 760px) {
      .detail { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
      .detail aside { border-left: 0; border-top: 1px solid var(--line); }
      .controls { margin-left: 0; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>3D models <small id="count"></small></h1>
      <div class="controls">
        <input type="search" id="filter" placeholder="Filter models" aria-label="Filter models">
        <div class="seg" role="group" aria-label="Side colour" id="side">
          <button type="button" data-side="neutral" aria-pressed="true">Neutral</button>
          <button type="button" data-side="hussites" aria-pressed="false">Hussites</button>
          <button type="button" data-side="crusaders" aria-pressed="false">Crusaders</button>
        </div>
        <label class="check"><input type="checkbox" id="spin"> Turn</label>
      </div>
    </div>
    <nav class="toc" id="toc"></nav>
  </header>
  <main id="groups"><p class="empty">Loading catalogue…</p></main>
  <canvas id="cards-canvas" aria-hidden="true"></canvas>

  <dialog id="detail" aria-label="Model detail">
    <div class="detail">
      <div class="stage" id="stage">
        <button type="button" class="btn close" id="close">Close</button>
        <span class="hint">Drag to orbit · right-drag to pan · scroll to zoom</span>
      </div>
      <aside>
        <div>
          <h3 id="d-name"></h3>
          <div class="path" id="d-path"></div>
        </div>
        <dl id="d-facts"></dl>
        <div class="opts">
          <label class="check"><input type="checkbox" id="d-scale" checked> 1.8 m person for scale</label>
          <label class="check"><input type="checkbox" id="d-grid" checked> 1 m grid</label>
          <label class="check"><input type="checkbox" id="d-wire"> Wireframe</label>
          <label class="check"><input type="checkbox" id="d-spin"> Turn</label>
          <label class="check" id="d-anim-row" hidden><input type="checkbox" id="d-anim" checked> Play animation</label>
        </div>
        <div>
          <div style="color: var(--muted); font-size: 12px; margin-bottom: 4px;">Materials</div>
          <div class="mats" id="d-mats"></div>
        </div>
        <div class="nav">
          <button type="button" class="btn" id="prev">← Previous</button>
          <button type="button" class="btn" id="next">Next →</button>
        </div>
      </aside>
    </div>
  </dialog>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
