[package]
name = "hussite-battlefield-poc"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "hussite-battlefield-poc"

[dependencies]
bevy = "0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[features]
default = ["browser-webgpu"]
browser-webgpu = ["bevy/webgpu"]
browser-50k = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = false
codegen-units = 16
