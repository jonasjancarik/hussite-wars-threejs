rames.length} frame_median_ms=${percentile(browserFrames,.5).toFixed(3)} frame_p95_ms=${percentile(browserFrames,.95).toFixed(3)}`)}}requestAnimationFrame(frame)}try{await init({module_or_path:new URL('./sudomer_battle_bg.wasm?v=SUDOMER_BATTLE_VERSION',import.meta.url)});document.getElementById('loading').remove();if(window.SUDOMER_BATTLE_CONFIG.measure)startBrowserMeasure()}catch(error){document.getElementById('loading').textContent='The battle could not load. Reload to try again.';console.error(error)}</script></body></html>
