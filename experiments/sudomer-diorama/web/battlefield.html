<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hussite Battlefield — Visual POC</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #777064;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #ece5d5;
        background: #777064;
        font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading the battlefield…</div>
    <script type="module">
      import init from "./moving_battlefield.js?v=BATTLEFIELD_VERSION";

      await init({ module_or_path: new URL("./moving_battlefield_bg.wasm?v=BATTLEFIELD_VERSION", import.meta.url) });
      document.querySelector("#loading")?.remove();
    </script>
  </body>
</html>
